<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Robôs Deriv</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 15px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
        select, input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-deriv { background: #ff444f; color: white; }
        #btn-start-bot { background: #22c55e; color: #fff; }
        #btn-start-bot:disabled { background: #334155; cursor: not-allowed; }
        #btn-stop-bot { background: #ef4444; color: #fff; }
        #btn-stop-bot:disabled { background: #334155; cursor: not-allowed; }
        #bot-logs { background: #0f172a; border: 1px solid #334155; padding: 10px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 11px; margin-top: 15px; border-radius: 4px; color: #38bdf8; }
        .user-info { background: #0f172a; padding: 10px; border-radius: 4px; border: 1px solid #22c55e; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Painel de Operações - Deriv</h2>
        
        <!-- Status e Conexão OAuth -->
        <div id="auth-section" class="form-group">
            <button class="btn-deriv" onclick="conectarOAuthDeriv()">Conectar Conta Deriv</button>
        </div>

        <div id="user-info" class="user-info">
            🟢 Conectado à Deriv | <span id="user-account">Conta Ativa</span>
        </div>

        <hr style="border-color: #334155; margin: 15px 0;">

        <!-- Seletor de Robôs -->
        <div class="form-group">
            <label>Selecione o Robô:</label>
            <select id="select-robo">
                <option value="robo_4x4">Robô JH Ós/Even (4x4)</option>
            </select>
        </div>

        <!-- Parâmetros Completos -->
        <div class="form-group">
            <label>Stake Inicial (USD):</label>
            <input type="number" id="stake-inicial" value="0.35" step="0.01">
        </div>
        <div class="form-group">
            <label>Meta de Loss Virtual:</label>
            <input type="number" id="meta-loss-virtual" value="4">
        </div>
        <div class="form-group">
            <label>Máximo de Martingale:</label>
            <input type="number" id="max-martingale" value="10">
        </div>
        <div class="form-group">
            <label>Fator Multiplicador (Martingale):</label>
            <input type="number" id="fator-multiplicador" value="1.8" step="0.1">
        </div>
        <div class="form-group">
            <label>Stop Win (USD):</label>
            <input type="number" id="stop-win" value="50">
        </div>
        <div class="form-group">
            <label>Stop Loss (USD):</label>
            <input type="number" id="stop-loss" value="50">
        </div>

        <!-- Botões de Controle -->
        <button id="btn-start-bot" disabled>▶️ Iniciar Robô</button>
        <button id="btn-stop-bot" disabled>⏸️ Parar Robô</button>

        <!-- Logs de Execução -->
        <h3>Logs do Sistema</h3>
        <div id="bot-logs">Aguardando conexão com a Deriv...<br></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
