<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 15px; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; }
        input, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { cursor: pointer; font-weight: bold; }
        #btn-start-bot { background: #22c55e; color: white; }
        .config-box { background: #1e293b; padding: 15px; border-radius: 8px; margin-top: 10px; }
        label { font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <h3>Painel de Controle</h3>
        <input type="password" id="input-token" placeholder="Cole seu Token">
        <button onclick="conectarComToken()" style="background: #3b82f6; color: white;">Conectar</button>

        <div class="config-box">
            <label>Stake Inicial (USD):</label>
            <input type="number" id="stake-inicial" value="0.35">
            
            <label>Stop Win:</label>
            <input type="number" id="stop-win" value="50">
            
            <label>Stop Loss:</label>
            <input type="number" id="stop-loss" value="50">
        </div>

        <button id="btn-start-bot" onclick="iniciarRobo()">▶️ Iniciar Robô</button>
        <div id="bot-logs" style="font-size: 11px; margin-top: 10px; color: #38bdf8;"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
