<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
        /* Botão inicia cinza e opaco */
        #btn-start-bot { width: 100%; padding: 15px; border: none; background: #334155; color: #fff; cursor: not-allowed; opacity: 0.5; }
    </style>
</head>
<body>
    <div id="auth-section">
        <input type="password" id="input-token" placeholder="Token aqui">
        <button onclick="conectarComToken()">Conectar</button>
    </div>
    <br>
    <!-- Botão SEM o atributo 'disabled' no HTML para evitar travamento -->
    <button id="btn-start-bot" onclick="iniciarRobo()">▶️ Iniciar Robô</button>
    <div id="bot-logs"></div>

    <script src="app.js"></script>
</body>
</html>
