<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Plataforma de Bots</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA DE LOGIN / CADASTRO -->
    <div id="auth-container" class="box">
        <h2>Acessar Plataforma</h2>
        <input type="email" id="email" placeholder="Seu E-mail">
        <input type="password" id="password" placeholder="Sua Senha">
        <div class="row">
            <button id="btn-login">Entrar</button>
            <button id="btn-register" class="secondary">Cadastrar</button>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="dashboard-container" class="box hidden">
        <h2>Bem-vindo ao Painel</h2>
        <p>Usuário: <span id="user-logged"></span></p>
        
        <hr>
        
        <h3>Conectar à Deriv</h3>
        <input type="text" id="deriv-token" placeholder="Cole seu Token de API da Deriv">
        <button id="btn-connect-deriv">Conectar Conta</button>
        <p id="deriv-status" class="status-offline">Status: Desconectado</p>

        <hr>

        <h3>Executar Robô</h3>
        <div class="row">
            <button id="btn-start-bot" disabled>▶️ Iniciar Bot</button>
            <button id="btn-stop-bot" class="danger" disabled>⏸️ Parar Bot</button>
        </div>
        
        <div id="bot-logs" class="logs-box">
            Aguardando inicialização...
        </div>

        <button id="btn-logout" class="danger-text">Sair da Conta</button>
    </div>

    <!-- Links oficiais do Firebase sem precisar de NPM (Versão Compat) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <!-- Script de Inicialização Direta -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCc9yvNTlh-DFHjk38e3aQ9HwF0f-yDmUc",
            authDomain: "hermannusbots.firebaseapp.com",
            projectId: "hermannusbots",
            storageBucket: "hermannusbots.firebasestorage.app",
            messagingSenderId: "76496490010",
            appId: "1:76496490010:web:e43024b6bb3b69f2ad0ba3",
            measurementId: "G-YR3GG9GHP8"
        };
        
        // Inicializa o Firebase globalmente na memória do navegador
        firebase.initializeApp(firebaseConfig);
        window.auth = firebase.auth();
    </script>

    <!-- O seu script local roda por último -->
    <script src="app.js"></script>
</body>
</html>
