<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Plataforma de Bots</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA DE LOGIN / CADASTRO -->
    <div id="auth-container" class="box">
        <h2>Acessar Plataforma</h2>
        <input type="email" id="email" placeholder="Seu E-mail">
        <input type="password" id="password" placeholder="Sua Senha">
        <div class="row">
            <button id="btn-login">Entrar</button>
            <button id="btn-register" class="secondary">Cadastrar</button>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="dashboard-container" class="box hidden">
        <h2>Bem-vindo ao Painel</h2>
        <p>Usuário: <span id="user-logged"></span></p>
        
        <hr>
        
        <h3>Conectar à Deriv</h3>
        <input type="text" id="deriv-token" placeholder="Cole seu Token de API da Deriv">
        <button id="btn-connect-deriv">Conectar Conta</button>
        <p id="deriv-status" class="status-offline">Status: Desconectado</p>

        <hr>

        <h3>Executar Robô</h3>
        <div class="row">
            <button id="btn-start-bot" disabled>▶️ Iniciar Bot</button>
            <button id="btn-stop-bot" class="danger" disabled>⏸️ Parar Bot</button>
        </div>
        
        <div id="bot-logs" class="logs-box">
            Aguardando inicialização...
        </div>

        <button id="btn-logout" class="danger-text">Sair da Conta</button>
    </div>

    <!-- Chamada moderna do script local como Módulo -->
    <script type="module" src="app.js"></script>
</body>
</html>
